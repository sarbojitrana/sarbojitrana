name: Update profile card

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Generate card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python .github/scripts/generate_svg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fetch_dark.svg .github/scripts/cache
          git diff --cached --quiet || git commit -m "chore: refresh profile card"
          git push
